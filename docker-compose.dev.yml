# Local Postgres for development: `npm run db:up`
services:
  db:
    image: postgres:17-alpine
    container_name: fitness-db-dev
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitness
    ports:
      # Only reachable from this computer, not from the rest of the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - fitness-db-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  fitness-db-dev:
